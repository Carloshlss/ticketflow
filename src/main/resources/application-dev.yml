# [SPRING BOOT] application-{profile}.yml é MESCLADO com o application.yml
# e tem PRECEDÊNCIA sobre ele. Chaves não repetidas aqui herdam a base.
spring:
  jpa:
    show-sql: false          # ← desligue; o p6spy substitui
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100    # teto de segurança global

logging:
  level:
    com.ticket.api: DEBUG
    org.hibernate.orm.jdbc.bind: OFF   # ← desnecessário com p6spy

decorator:
  datasource:
    p6spy:
      enable-logging: true