# [SPRING BOOT] Configuração externalizada. Qualquer propriedade aqui pode ser
# sobrescrita por variável de ambiente — essencial para Docker e Cloud.
# Ex.: SERVER_PORT=9090 sobrescreve server.port
spring:
  application:
    name: ticketflow-api

server:
  port: 8080

# [ACTUATOR] Por padrão só /health é exposto. Aqui liberamos mais e pedimos
# detalhes no health (útil na Fase 2 para ver se o Postgres está OK).
manegement:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# [OBSERVABILIDADE] Log em nível DEBUG só do nosso pacote, para aprendizado.
logging:
  level:
    com.ticketflow.api: DEBUG